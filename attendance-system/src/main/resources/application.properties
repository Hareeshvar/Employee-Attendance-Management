spring.application.name=attendance-system

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/attendance_system?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hareesh33@mi}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline Schema

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:hareeshvarattendanceprojectjwtsecretkey2026springbootsecurity123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# Security Audit Configuration
app.security.trust-proxy=${TRUST_PROXY:false}

# Default Development Credentials
app.default-admin.username=${DEFAULT_ADMIN_USERNAME:admin}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:admin123}
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:admin@attendance.com}

app.default-hr.username=${DEFAULT_HR_USERNAME:hr}
app.default-hr.password=${DEFAULT_HR_PASSWORD:hr123}
app.default-hr.email=${DEFAULT_HR_EMAIL:hr@attendance.com}

app.default-manager.username=${DEFAULT_MANAGER_USERNAME:manager}
app.default-manager.password=${DEFAULT_MANAGER_PASSWORD:manager123}
app.default-manager.email=${DEFAULT_MANAGER_EMAIL:manager@attendance.com}

app.default-employee.username=${DEFAULT_EMPLOYEE_USERNAME:employee}
app.default-employee.password=${DEFAULT_EMPLOYEE_PASSWORD:employee123}
app.default-employee.email=${DEFAULT_EMPLOYEE_EMAIL:employee@attendance.com}

# Server Port
server.port=8080